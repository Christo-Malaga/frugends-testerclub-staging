<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="referrer" content="no-referrer" />
<title>FRUGENDS</title>
<link rel="icon" type="image/png" href="/favicon-64.png" />
<style>
@font-face { font-family: 'Protest Strike'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/protest-strike.woff2) format('woff2'); }
@font-face { font-family: 'Outfit'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/outfit.woff2) format('woff2'); }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; place-items: center; min-height: 100svh; padding: 24px; overflow: hidden;
  color: #fff; font-family: 'Outfit', system-ui, sans-serif; text-align: center;
  background:
    radial-gradient(60% 45% at 50% 42%, rgba(255, 205, 40, 0.16), transparent 70%),
    radial-gradient(80% 70% at 50% 110%, rgba(124, 92, 191, 0.45), transparent 70%),
    linear-gradient(180deg, #141729 0%, #1d1c4a 55%, #141729 100%);
}
main { display: grid; justify-items: center; gap: clamp(18px, 3.2vh, 30px); max-width: 760px; }
img { width: clamp(150px, 34vw, 220px); height: auto; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45)); }
h1 {
  margin: 0; font: 400 clamp(2.2rem, 7.4vw, 4.4rem) / 1 'Protest Strike', system-ui, sans-serif; letter-spacing: 0.01em;
  text-wrap: balance;
}
p {
  margin: 0; font: 600 clamp(1.15rem, 3.4vw, 1.6rem) / 1.3 'Outfit', system-ui, sans-serif; color: #ffcd28;
}
</style>
</head>
<body>
<main>
  <img src="/logo/frugends-arena.webp" width="320" height="168" alt="FRUGENDS" />
  <h1>Hier entsteht was richtig Cooles.</h1>
  <p>Im Dezember geht’s los.</p>
</main>
</body>
</html>
